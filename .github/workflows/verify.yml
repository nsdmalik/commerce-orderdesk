name: Verify application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orderdesk
          POSTGRES_PASSWORD: orderdesk
          POSTGRES_DB: orderdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orderdesk"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://orderdesk:orderdesk@127.0.0.1:5432/orderdesk_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
