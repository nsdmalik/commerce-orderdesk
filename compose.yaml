services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orderdesk
      POSTGRES_PASSWORD: orderdesk
      POSTGRES_DB: orderdesk
    ports:
      - '127.0.0.1:5544:5432'
    volumes:
      - orderdesk_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orderdesk']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  orderdesk_data:
